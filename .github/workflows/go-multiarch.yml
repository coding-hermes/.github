# ─────────────────────────────────────────────────────────────────────────────
# coding-hermes reusable workflow — Go multi-arch build, test, release
#
# Call it from any repo in the org:
#
#   jobs:
#     multiarch:
#       uses: coding-hermes/.github/.github/workflows/go-multiarch.yml@main
#       with:
#         binary: boardctl
#         main: ./cmd/boardctl
#         docker-image: true
#         dockerfile: ./Dockerfile
#       permissions: { contents: write, id-token: write, attestations: write }
#
# Why cross-compile instead of QEMU: every repo in this fleet is pure Go
# (CGO_ENABLED=0 — modernc.org/sqlite is pure Go), so `go build` produces
# foreign-arch binaries natively on the amd64 runner. QEMU is only used for
# multi-arch *container images*. Native arm64 tests run on GitHub's free
# ubuntu-24.04-arm runner for public repos (no emulation, real coverage).
# ─────────────────────────────────────────────────────────────────────────────
name: Go Multi-Arch

on:
  workflow_call:
    inputs:
      binary:
        description: Output binary name (no extension)
        type: string
        required: true
      main:
        description: Main package path to build
        type: string
        default: .
      go-version:
        description: Go toolchain version
        type: string
        default: "1.26"
      version-var:
        description: ldflags -X variable to stamp the version into (empty = skip)
        type: string
        default: main.version
      platforms:
        description: JSON array of GOOS/GOARCH pairs
        type: string
        default: '["linux/amd64","linux/arm64","darwin/amd64","darwin/arm64","windows/amd64","windows/arm64"]'
      run-arm64-tests:
        description: Run the suite natively on an arm64 runner (public repos; free)
        type: boolean
        default: true
      docker-image:
        description: Also build (and on tags push) a multi-arch container image
        type: boolean
        default: false
      dockerfile:
        description: Dockerfile path for the image build
        type: string
        default: ./Dockerfile
      image-name:
        description: Image name under the registry (defaults to the repo name)
        type: string
        default: ""
    outputs:
      version:
        description: Version string stamped into the binaries
        value: ${{ jobs.verify.outputs.version }}

permissions:
  contents: read

jobs:
  # ── 1. Native gate: build, vet, test. Nothing ships if this is red. ────────
  verify:
    name: Verify (amd64)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev+${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test (short)
        run: go test -count=1 -short ./...

  # ── 2. Cross-compile the matrix — pure Go, no emulation. ──────────────────
  cross-build:
    name: Build ${{ matrix.platform }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Build
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          GOOS_ARCH: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          goos="${GOOS_ARCH%%/*}"
          goarch="${GOOS_ARCH##*/}"
          ext=""; [[ "$goos" == "windows" ]] && ext=".exe"
          out="${{ inputs.binary }}_${goos}_${goarch}${ext}"
          ldflags="-s -w"
          if [[ -n "${{ inputs.version-var }}" ]]; then
            ldflags="$ldflags -X ${{ inputs.version-var }}=${VERSION}"
          fi
          mkdir -p dist
          CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
            go build -trimpath -ldflags "$ldflags" \
            -o "dist/$out" "${{ inputs.main }}"
          # prove the artifact really is the requested arch
          file "dist/$out"
          go version -m "dist/$out" >/dev/null
          (cd dist && sha256sum "$out" >> SHA256SUMS)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.binary }}-${{ strategy.job-index }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ── 3. Native arm64 test run (real coverage, not emulated). ───────────────
  test-arm64:
    name: Verify (arm64, native)
    needs: verify
    if: ${{ inputs.run-arm64-tests }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: go build + test (arm64)
        run: |
          go build ./...
          go test -count=1 -short ./...

  # ── 4. Multi-arch container image (QEMU only where it is unavoidable). ────
  docker:
    name: Container (multi-arch)
    needs: verify
    if: ${{ inputs.docker-image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: img
        run: |
          name="${{ inputs.image-name }}"
          if [[ -z "$name" ]]; then name="${GITHUB_REPOSITORY##*/}"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 5. Release: one archive per platform + checksums + provenance. ────────
  release:
    name: Release
    needs: [verify, cross-build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums (stable order)
        working-directory: dist
        run: |
          rm -f SHA256SUMS SHA256SUMS.txt
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            dist/*
